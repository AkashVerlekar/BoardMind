version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: boardmind_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boardmind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boardmind_pass}
      POSTGRES_DB: ${POSTGRES_DB:-boardmind}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boardmind_user} -d ${POSTGRES_DB:-boardmind}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
